name: 功能建议
description: 改进 USS-P 草案、互操作性、用户安全指南或参考工作台
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        USS-P 是早期应用层草案，不是运营商标准或认证。本项目不接受短信轰炸、绕过退订或触达未授权对象的功能。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 说明当前不方便的地方和使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎样改进？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过哪些替代方案？
