name: Validate static workspace

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install protocol validation tools
        run: npm ci
      - name: Check JavaScript syntax
        run: node --check public/app.js
      - name: Check required Pages files
        run: test -s public/index.html && test -s public/styles.css && test -s public/app.js
      - name: Run protocol conformance tests
        run: npm test && npm run validate:examples
